# Differential of the Go mirrors against the proven Ada cores they claim to mirror.
#
# WHY THIS EXISTS. internal/gate/gate.go states that MayCommand "is byte-for-byte
# the function that mirrors ledger 112". Until 2026-08-25 nothing executed the Ada
# to find out: equivalence rested on hand-written Go vectors, and two
# implementations with one proof between them can agree with their own tests while
# diverging from each other.
#
# This is a DIFFERENT guarantee from the gobra workflow, and neither replaces the
# other:
#   gobra           — PROVES the Go satisfies ledger 112's postconditions.
#   core-differential — CHECKS the Go and the Ada produce the same verdict, case
#                     for case, over the entire input domain.
# A mirror can satisfy every postcondition and still disagree with the core on a
# case the contract underdetermines. Only execution catches that.
#
# The vectors are EXHAUSTIVE, not sampled: Command (6) x ceiling (6) x Consent (3)
# x Authentic (2) = 216 is the whole domain of May_Command. They are generated by
# building the admitted core itself — see internal/gate/testdata/README.md for the
# provenance, the source hash, and the regeneration procedure.
#
# No Ada toolchain is needed here: the vectors are committed, hash-attributed
# output of the proven core. If the core is ever re-forged, the table is stale and
# must be regenerated in the same commit.

name: core-differential

on:
  push:
    paths:
      - "internal/gate/**"
      - ".github/workflows/core-differential.yml"
  pull_request:
    paths:
      - "internal/gate/**"
      - ".github/workflows/core-differential.yml"

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Golden vectors must be present and whole
        run: |
          set -eu
          vectors=internal/gate/testdata/ledger112_vectors.txt
          test -f "$vectors" || { echo "::error::$vectors is missing"; exit 1; }
          lines=$(grep -c . "$vectors")
          if [ "$lines" -ne 216 ]; then
            echo "::error::$vectors has $lines cases, expected the full 216-case domain"
            exit 1
          fi
          echo "golden table present: $lines cases"

      - name: Differential — Go mirror vs proven core (ledger 112)
        run: go test ./internal/gate/ -run TestGateExhaustiveGoldenLedger112 -count=1 -v

      - name: Full gate suite
        run: go test ./internal/gate/ -count=1
